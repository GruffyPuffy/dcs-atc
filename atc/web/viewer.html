<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATC Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/map.css">
</head>
<body>
  <header class="topbar">
    <strong id="title">ATC Viewer</strong>
    <small id="build-version" class="build-version"></small>
    <span id="status" class="status">connecting…</span>
    <span class="legend">
      <span class="dot ground"></span>Ground
      <span class="dot tower"></span>Tower
      <span class="dot control"></span>Control
    </span>
    <label class="toggle"><input type="checkbox" id="chart-toggle" checked> Chart</label>
    <label class="toggle" id="vectors-toggle-wrap" hidden>
      <input type="checkbox" id="vectors-toggle" checked> Vectors
    </label>
    <select id="debrief-select" title="Pick a saved debrief (read-only replay)">
      <option value="" disabled>— pick a debrief —</option>
    </select>
  </header>
  <div id="map"></div>
  <aside id="panel">
    <h2>Traffic</h2>
    <table id="traffic">
      <thead><tr><th>Callsign</th><th>Phase</th><th>Alt</th><th>Hdg</th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="error" class="error" hidden></p>
  </aside>
  <section id="chatter" class="collapsed">
    <header id="chatter-head">
      <button id="chatter-toggle" aria-expanded="false">▲ Chatter</button>
      <span id="chatter-filters" class="filters"></span>
    </header>
    <div id="chatter-log"></div>
  </section>
  <script>
    // The viewer reuses map.js's rendering, but not its bot-coupled auto-run
    // (tick() polls /api/atc and would stomp a selected replay every 2 s).
    // Tag every interval map.js creates, so viewer.js can stop exactly those.
    window.__mapIntervals = [];
    const _origSetInterval = window.setInterval;
    window.setInterval = function (fn, ms, ...rest) {
      const id = _origSetInterval.call(window, fn, ms, ...rest);
      if (!window.__viewerTimersActive) window.__mapIntervals.push(id);
      return id;
    };
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/map.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>

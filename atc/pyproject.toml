[project]
name = "atc"
version = "0.1.0"
description = "Headless SRS ATC trainer client: listen, STT, log"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Stefan Grufman (Caveman)" }]
dependencies = [
    "numpy>=1.26",
    "av>=14.0.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

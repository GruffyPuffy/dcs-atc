<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCS Observer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui,sans-serif;background:#111820;color:#e6edf3}header{height:48px;display:flex;align-items:center;gap:18px;padding:0 14px;background:#1c2732;border-bottom:1px solid #394653}header strong{font-size:17px}#status{color:#9daab7}#map{position:absolute;inset:48px 400px 0 0;background:#202830}.panel{position:absolute;right:0;top:48px;bottom:0;width:400px;overflow:auto;background:#18212a;border-left:1px solid #394653;padding:12px}.panel h2{margin:0 0 8px;font-size:16px}.tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}.tools input{width:60px;background:#111820;color:#fff;border:1px solid #52606d;padding:4px}.tools select{max-width:170px;background:#111820;color:#fff;padding:4px}.unit-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.unit-list{min-width:0}.unit-list h3{position:sticky;top:0;margin:0;padding:6px 2px;background:#18212a;font-size:13px;z-index:1}.item{display:grid;grid-template-columns:16px minmax(0,1fr);gap:5px;padding:6px 1px;border-bottom:1px solid #2e3a45;align-items:center}.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{display:block;overflow:hidden;text-overflow:ellipsis;color:#9daab7}.item input{accent-color:#57a6ff;margin:0}.error{color:#ff7b72}.leaflet-popup-content{color:#17212b}.unit-symbol{background:transparent;border:0}@media(max-width:700px){#map{right:0;bottom:38%}.panel{top:auto;left:0;width:auto;height:38%;border-left:0;border-top:1px solid #394653}}
</style></head><body>
<header><strong>DCS Observer</strong><span id="status">Connecting…</span><span id="srs"></span><span id="updated"></span><label><input id="vectors" type="checkbox" checked> Map labels</label></header>
<div id="map"></div><aside class="panel"><h2>Units</h2><div class="tools"><label>Path minutes <input id="history" type="number" min="1" max="180" value="180"></label></div><div class="tools"><label for="focus">Follow</label><select id="focus"><option value="">None</option></select></div><div class="unit-columns"><section class="unit-list"><h3>Real Players <span id="player-count"></span></h3><div id="players"></div></section><section class="unit-list"><h3>AI / no player <span id="ai-count"></span></h3><div id="ai"></div></section></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/milsymbol@3.0.4/dist/milsymbol.js"></script>
<script src="/observer.js"></script></body></html>

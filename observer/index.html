<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCS Observer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui,sans-serif;background:#111820;color:#e6edf3}header{height:48px;display:flex;align-items:center;gap:18px;padding:0 14px;background:#1c2732;border-bottom:1px solid #394653}header strong{font-size:17px}#status{color:#9daab7}#map{position:absolute;inset:48px 310px 0 0;background:#202830}.panel{position:absolute;right:0;top:48px;bottom:0;width:310px;overflow:auto;background:#18212a;border-left:1px solid #394653;padding:12px}.panel h2{margin:0 0 8px;font-size:16px}.tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}.tools input{width:60px;background:#111820;color:#fff;border:1px solid #52606d;padding:4px}.tools select{max-width:170px;background:#111820;color:#fff;padding:4px}.item{display:grid;grid-template-columns:20px 1fr auto;gap:6px;padding:7px 2px;border-bottom:1px solid #2e3a45;align-items:center}.item small{display:block;color:#9daab7}.item input{accent-color:#57a6ff}.error{color:#ff7b72}.leaflet-popup-content{color:#17212b}@media(max-width:700px){#map{right:0;bottom:38%}.panel{top:auto;left:0;width:auto;height:38%;border-left:0;border-top:1px solid #394653}}
</style></head><body>
<header><strong>DCS Observer</strong><span id="status">Connecting…</span><span id="srs"></span><span id="updated"></span></header>
<div id="map"></div><aside class="panel"><h2>Aircraft</h2><div class="tools"><label>Path minutes <input id="history" type="number" min="1" max="180" value="180"></label></div><div class="tools"><label for="focus">Follow</label><select id="focus"><option value="">None</option></select></div><div id="aircraft"></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/observer.js"></script></body></html>
